<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#7a4a22"/>
    <stop offset="0.45" stop-color="#4a2810"/>
    <stop offset="1" stop-color="#170b04"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff1b8"/>
    <stop offset="0.35" stop-color="#f2c75c"/>
    <stop offset="0.72" stop-color="#c98f2a"/>
    <stop offset="1" stop-color="#8c5a16"/>
